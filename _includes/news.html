{%- assign items = site.data.news | sort: "date" | reverse -%}
<section class="section" id="news" aria-labelledby="news-h">
  <div class="section-head"><h2 class="section-title" id="news-h">News</h2></div>
  <ol class="news">
    {%- for n in items %}
    <li><time datetime="{{ n.date | date: '%Y-%m' }}">{{ n.date | date: '%b %Y' }}</time><p>{{ n.text | markdownify | remove: '<p>' | remove: '</p>' | strip }}</p></li>
    {%- endfor %}
  </ol>
</section>
