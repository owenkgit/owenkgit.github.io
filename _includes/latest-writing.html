{%- assign total = 0 -%}
{%- for g in site.data.blog %}{% assign total = total | plus: g.posts.size %}{% endfor -%}
<section class="section" id="latest" aria-labelledby="latest-h">
  <div class="section-head">
    <h2 class="section-title" id="latest-h">Latest writing</h2>
    <a class="section-link" href="#writing">All {{ total }} posts ↓</a>
  </div>
  <div class="cards3">
    {%- for g in site.data.blog %}
    {%- assign post = g.posts.first %}
    <a class="wcard" href="{{ post.url }}" target="_blank" rel="noopener"><span class="label">{{ g.group | escape }}</span><h3>{{ post.title }}</h3><p>{{ post.blurb }}</p></a>
    {%- endfor %}
  </div>
</section>
