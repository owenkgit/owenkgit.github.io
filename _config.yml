# Site ------------------------------------------------------------------------
title: Owen Kwon
description: >-
  Owen Kwon's research focuses on making learned robot policies steerable
  through human intervention, and on the human data behind them.
url: https://owenkgit.github.io
lang: en
author: Owen Kwon
timezone: America/New_York

# Link previews and search metadata (jekyll-seo-tag)
twitter:
  card: summary_large_image
social:
  name: Owen Kwon
  links:
    - https://github.com/owenk3
    - https://www.linkedin.com/in/oyeonk
defaults:
  - scope: { path: "" }
    values: { image: /static/media/og.jpg }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

# Build -----------------------------------------------------------------------
# Content lives in _data/*.yml and index.md; markup in _layouts/ and _includes/;
# styles, scripts, fonts and media in static/.
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - images/
  - ref/
