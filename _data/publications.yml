- title: "RT-Cache: Training-Free Retrieval for Real-Time Manipulation"
  authors: [Owen Kwon, Abraham George, Alison Bartsch, Amir Barati Farimani]
  venue: Humanoids 2025
  venue_full: IEEE-RAS International Conference on Humanoid Robots
  summary: Retrieval as control. Matches the current camera frame to stored image–action snippets and replays the best one, adapting in real time by simply adding new episodes.
