<section class="row" id="writing" aria-labelledby="writing-h">
  <h2 class="row-label" id="writing-h">Writing</h2>
  <div>
    {%- for g in site.data.blog %}
    <div class="topic-group">
      <h3 class="topic">{{ g.group | escape }}</h3>
      <ul class="posts">
        {%- for post in g.posts %}
        <li><a class="item-link" href="{{ post.url }}" target="_blank" rel="noopener">{{ post.title }}</a><span class="desc">{{ post.blurb }}</span></li>
        {%- endfor %}
      </ul>
    </div>
    {%- endfor %}
  </div>
</section>
