# Site ------------------------------------------------------------------------
title: Owen Kwon
description: >-
  Owen Kwon works on corrigibility in learned robot policies: correcting a
  policy's behavior while it runs, without retraining. MS, Carnegie Mellon University.
url: https://owenkgit.github.io
lang: en
author: Owen Kwon
timezone: America/New_York

# Link previews and search metadata (jekyll-seo-tag)
twitter:
  card: summary_large_image
social:
  name: Owen Kwon
  links:
    - https://github.com/owenk3
    - https://www.linkedin.com/in/oyeonk
defaults:
  - scope: { path: "" }
    values: { image: /static/media/og.jpg }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

# Build -----------------------------------------------------------------------
# Content lives in _data/*.yml and index.md; markup in _layouts/ and _includes/;
# styles, scripts, fonts and media in static/.
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - images/
  - ref/
  # Legacy al-folio files, unused by this site. Safe to delete together with
  # _bibliography/, _news/, _pages/, _plugins/, _portfolio/, _sass/, the
  # *.liquid files in _layouts/ and _includes/, and unused files in _data/.
  - assets/
  - bin/
  - lighthouse_results/
  - readme_preview/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - FAQ.md
  - INSTALL.md
  - LICENSE
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - package.json
  - package-lock.json
  - purgecss.config.js
