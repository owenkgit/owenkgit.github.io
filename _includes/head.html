<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% seo title=false %}
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="{{ '/static/fonts/source-sans.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% include asset.html path='/static/css/site.css' %}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="{% include asset.html path='/static/icons/apple-touch-icon.png' %}">
<script src="{% include asset.html path='/static/js/site.js' %}" defer></script>
